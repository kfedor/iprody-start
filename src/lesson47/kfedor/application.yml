spring:
  datasource:
    url: jdbc:postgresql://host.docker.internal:5432/library_db?currentSchema=library
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  logging:
    level:
      org.hibernate.SQL: debug

server:
  port: 8080
  error:
    include-message: always

