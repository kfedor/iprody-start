spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db?currentSchema=order
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  logging:
    level:
      org.hibernate.SQL: debug

server:
  port: 8080
